[package]
name = "gbfam"
version = "0.2.0"
edition = "2024"

[dependencies]
tempfile = "3.27.0"
anyhow = "1.0.104"
base64 = "0.23.1"
cfb = "0.16.0"
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
ed25519-dalek = "3.0.0"
fastembed = "7.7.1"
flate2 = "1.1.11"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
image = "0.25.10"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
walkdir = "2.5.1"

