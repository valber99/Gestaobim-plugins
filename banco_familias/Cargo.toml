[package]
name = "gbfam"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cfb = "0.16.0"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
fastembed = "7.7.1"
futures = "0.3.34"
hex = "0.4.3"
image = "0.25.10"
indicatif = "0.18.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "json", "macros", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time"] }
walkdir = "2.5.1"
