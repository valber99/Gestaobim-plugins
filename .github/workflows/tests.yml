name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (.NET)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/GBMaterialStudio.Core.Tests -c Release --nologo

  addin:
    name: Add-in (Revit 2025, 2026, 2027)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and package
        shell: pwsh
        run: ./build/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: GBMaterialStudio
          path: dist/*.zip

  pyrevit-edition:
    name: pyRevit edition (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
