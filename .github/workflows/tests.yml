name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (.NET)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        project: [GBMaterialStudio.Core.Tests, GBDwgExport.Core.Tests, GBFamilias.Core.Tests, GBCotas.Core.Tests, GBRender.Core.Tests]
        include:
          # O gateway de IA usa a DPAPI e as ACLs do Windows: os testes dele so rodam no Windows.
          - os: windows-latest
            project: GBAi.Shared.Tests
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/${{ matrix.project }} -c Release --nologo

  addin:
    name: Add-ins (Revit 2025, 2026, 2027)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: GB Material Studio
        shell: pwsh
        run: ./build/package.ps1
      - name: GB DWG Export
        shell: pwsh
        run: ./build/package-dwg.ps1
      - name: GB Cotas e GB Render (com o CLIProxyAPI conferido por SHA-256)
        shell: pwsh
        run: ./build/package-ia.ps1
      # O GB Famílias leva o gbfam.exe e ~1 GB de modelos de IA, que não estão no repositório:
      # o pacote é gerado na máquina de quem publica (build/package-familias.ps1). Aqui só confere que compila.
      - name: GB Famílias (compilação)
        shell: pwsh
        run: |
          foreach ($year in 2025, 2026, 2027) {
            dotnet build src/GBFamilias/GBFamilias.csproj -c Release "-p:RevitVersion=$year" --nologo -v q
            if ($LASTEXITCODE -ne 0) { throw "Falha ao compilar o GB Famílias para o Revit $year" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.exe

  pyrevit-edition:
    name: pyRevit edition (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q

  gbfam:
    name: gbfam (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/gbfam
      # Os testes do catálogo (assinatura, delta, cadeia) não precisam dos modelos de IA.
      - run: cargo test --release --manifest-path tools/gbfam/Cargo.toml
